name: V9R2R1 repository evidence contracts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_public_checkout_live:
        description: Re-run the public checkout and verify its exact expected 78-outcome failure contract
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  public-checkout-reference-contract:
    name: Public checkout expected-failure reference (78 outcomes)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"

      - name: Verify current 203-file source and 139-module test closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/verify_v9r2r1_current_source.py `
            --root . `
            --manifest V21E3R1_V9R2R1_SOURCE_MANIFEST.json `
            --require-git-tracked `
            --require-pass
          if ($LASTEXITCODE -ne 0) { throw 'current public source closure drifted' }
          python scripts/build_v9r2r1_full_suite_test_manifest.py verify `
            --root . `
            --manifest provenance/V9R2R1_FULL_SUITE_TEST_MANIFEST.json
          if ($LASTEXITCODE -ne 0) { throw 'current public test-source closure drifted' }

      - name: Verify checked-in sanitized public-checkout evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'public-checkout-reference-contract.json'
          python scripts/sanitize_public_checkout_outputs.py verify `
            --receipt provenance/V9R2R1_RAW_OUTPUT_SANITIZATION_RECEIPT.json `
            --junit evidence/public_checkout/full_repository.sanitized.junit.xml `
            --log evidence/public_checkout/full_repository.sanitized.log
          if ($LASTEXITCODE -ne 0) { throw 'checked-in public evidence sanitization receipt drifted' }
          python scripts/verify_expected_public_checkout_failure_set.py `
            --registry provenance/V9R2R1_EXPECTED_PUBLIC_CHECKOUT_FAILURE_SET.json `
            --junit evidence/public_checkout/full_repository.sanitized.junit.xml `
            --log evidence/public_checkout/full_repository.sanitized.log `
            --require-reference-evidence-sha256 `
            --output $receipt
          if ($LASTEXITCODE -ne 0) { throw 'public-checkout reference failure contract drifted' }
          Write-Host 'PASS public-checkout reference contract: 78 expected failed outcomes (77 JUnit failing/error testcases), classified 70 held, 7 frozen-V8, 1 sealed-output.'
          Write-Warning 'This is public engineering evidence, not repository-wide green and not an internal complete-tree result.'

      - name: Upload public-checkout reference receipt
        uses: actions/upload-artifact@v4
        with:
          name: v9r2r1-public-checkout-reference-contract
          path: ${{ runner.temp }}/public-checkout-reference-contract.json
          if-no-files-found: error

  internal-complete-tree-reference:
    name: Internal complete-tree historical reference (exact eight)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"

      - name: Verify byte-bound internal complete-tree reference only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'internal-complete-tree-exact-eight-reference.json'
          python scripts/verify_expected_historical_failure_set.py `
            --registry provenance/V9R2R1_EXPECTED_HISTORICAL_V8_FAILURE_SET.json `
            --junit evidence/v9r2r1_environment_recovery_20260825_002/full_repository.junit.xml `
            --require-reference-sha256 `
            --output $receipt
          if ($LASTEXITCODE -ne 0) { throw 'internal complete-tree exact-eight reference drifted' }
          Write-Host 'PASS byte-bound internal complete-tree historical reference: exact eight frozen-V8 failures.'
          Write-Warning 'Reference replay does not describe the current public checkout and does not grant access to withheld internal dependencies.'

      - name: Upload internal complete-tree reference receipt
        uses: actions/upload-artifact@v4
        with:
          name: v9r2r1-internal-complete-tree-exact-eight-reference
          path: ${{ runner.temp }}/internal-complete-tree-exact-eight-reference.json
          if-no-files-found: error

  public-checkout-live-contract:
    name: Public checkout live expected-failure contract
    needs: public-checkout-reference-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_public_checkout_live }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Materialize observed Anaconda interpreter identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapConda = 'C:\Miniconda\Scripts\conda.exe'
          $basePrefix = 'C:\miniconda3'
          $basePython = 'C:\miniconda3\python.exe'
          $ssmPrefix = 'C:\miniconda3\envs\ssm_env'
          $ssmPython = 'C:\miniconda3\envs\ssm_env\python.exe'
          if (-not (Test-Path -LiteralPath $bootstrapConda -PathType Leaf)) {
            throw 'GitHub runner bootstrap conda is unavailable at its declared image path'
          }
          if (Test-Path -LiteralPath $basePrefix) {
            throw 'exact live interpreter prefix unexpectedly pre-exists'
          }
          & $bootstrapConda create --yes --quiet `
            --prefix $basePrefix `
            --override-channels `
            --channel 'https://repo.anaconda.com/pkgs/main' `
            'python=3.13.12=h39c999c_100_cp313'
          if ($LASTEXITCODE -ne 0) { throw 'exact Anaconda CPython 3.13.12 materialization failed' }
          & $bootstrapConda create --yes --quiet `
            --prefix $ssmPrefix `
            --override-channels `
            --channel 'https://repo.anaconda.com/pkgs/main' `
            'python=3.11.15=h1044e36_0'
          if ($LASTEXITCODE -ne 0) { throw 'nonhistorical ssm_env path materialization failed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $basePython).Hash.ToLowerInvariant() -ne 'f77193cf0405ab440c39324bdb2f8864596321c1df888adbbe357f3d760f4716') {
            throw 'exact Anaconda CPython 3.13.12 executable hash drifted'
          }
          if ((Get-Item -LiteralPath $basePython).Length -ne 105288) {
            throw 'exact Anaconda CPython 3.13.12 executable size drifted'
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $ssmPython).Hash.ToLowerInvariant() -ne '418228fb1417da15512fc44aba6f2e1d948786878ffd06fd661881c6d104c0f6') {
            throw 'exact Anaconda CPython 3.11.15 executable hash drifted'
          }
          if ((Get-Item -LiteralPath $ssmPython).Length -ne 105288) {
            throw 'exact Anaconda CPython 3.11.15 executable size drifted'
          }
          $baseIdentity = (& $basePython -c "import json,sys; print(json.dumps({'executable':sys.executable,'prefix':sys.prefix,'base_prefix':sys.base_prefix,'version':sys.version},sort_keys=True))") | ConvertFrom-Json
          if (
            $baseIdentity.executable -ne $basePython -or
            $baseIdentity.prefix -ne $basePrefix -or
            $baseIdentity.base_prefix -ne $basePrefix -or
            $baseIdentity.version -ne '3.13.12 | packaged by Anaconda, Inc. | (main, Feb 24 2026, 16:05:56) [MSC v.1942 64 bit (AMD64)]'
          ) {
            throw 'exact Anaconda CPython 3.13.12 runtime identity drifted'
          }
          $ssmIdentity = (& $ssmPython -c "import json,sys; print(json.dumps({'executable':sys.executable,'prefix':sys.prefix,'base_prefix':sys.base_prefix,'version':sys.version},sort_keys=True))") | ConvertFrom-Json
          if (
            $ssmIdentity.executable -ne $ssmPython -or
            $ssmIdentity.prefix -ne $ssmPrefix -or
            $ssmIdentity.base_prefix -ne $ssmPrefix -or
            $ssmIdentity.version -ne '3.11.15 | packaged by Anaconda, Inc. | (main, Mar 11 2026, 17:12:15) [MSC v.1942 64 bit (AMD64)]'
          ) {
            throw 'exact Anaconda CPython 3.11.15 runtime identity drifted'
          }
          $basePrefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $basePrefix 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'V9R2R1_LIVE_PYTHON=C:\miniconda3\python.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Warning 'Exact observed interpreter identities are materialized for frozen test semantics; the artifact-hashed environment lock remains false.'

      - name: Verify live checkout source and test closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $activePython = (Get-Command python).Source
          if ($activePython -ne $env:V9R2R1_LIVE_PYTHON) { throw "unexpected active live interpreter: $activePython" }
          python scripts/verify_v9r2r1_current_source.py `
            --root . `
            --manifest V21E3R1_V9R2R1_SOURCE_MANIFEST.json `
            --require-git-tracked `
            --require-pass
          if ($LASTEXITCODE -ne 0) { throw 'live public source closure drifted' }
          python scripts/build_v9r2r1_full_suite_test_manifest.py verify `
            --root . `
            --manifest provenance/V9R2R1_FULL_SUITE_TEST_MANIFEST.json
          if ($LASTEXITCODE -ne 0) { throw 'live public test-source closure drifted' }

      - name: Verify requirement-file checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in Get-Content -LiteralPath requirements/locks.sha256) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "invalid locks.sha256 line: $line" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Matches[2]).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "lock checksum mismatch: $($Matches[2])" }
          }

      - name: Install observed full-suite version closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --no-deps -r requirements/optional-pymoo.lock
          if ($LASTEXITCODE -ne 0) { throw 'optional pymoo lock installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }
          python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; import moocore, pytest, pymoo"
          if ($LASTEXITCODE -ne 0) { throw 'full test-import closure failed' }

      - name: Fail-fast backend preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $python = (Get-Command python).Source
          $receipt = Join-Path $env:RUNNER_TEMP 'public_checkout_live_environment_preflight.json'
          $rawLog = Join-Path $env:RUNNER_TEMP 'public_checkout_live_environment_preflight.raw.log'
          python scripts/check_v9r2r1_full_suite_environment.py `
            --expected-python-executable $python `
            --expected-python-version-prefix 3.13.12 `
            --expected-pymoo-version 0.6.1.6 `
            --expected-moocore-version 0.3.1 `
            --output $receipt *> $rawLog
          $preflightExit = $LASTEXITCODE
          if ($preflightExit -ne 0) { throw 'HOLD_PUBLIC_CHECKOUT_LIVE_ENVIRONMENT; raw details remain local to RUNNER_TEMP' }
          Write-Warning 'This CI environment is version-pinned but is not the artifact-hashed Anaconda recovery environment.'

      - name: Sanitize and verify live environment preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rawPreflight = Join-Path $env:RUNNER_TEMP 'public_checkout_live_environment_preflight.json'
          $rawLog = Join-Path $env:RUNNER_TEMP 'public_checkout_live_environment_preflight.raw.log'
          $safePreflight = Join-Path $env:RUNNER_TEMP 'public_checkout_live_environment_preflight.sanitized.json'
          $safeLog = Join-Path $env:RUNNER_TEMP 'public_checkout_live_environment_preflight.sanitized.log'
          $receipt = Join-Path $env:RUNNER_TEMP 'public_checkout_live_environment_preflight.sanitization.json'
          $referenceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve live preflight checkout commit' }
          $referenceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve live preflight checkout tree' }
          $pythonPrefix = (python -c "import sys; print(sys.prefix)").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve live preflight Python prefix' }
          python scripts/sanitize_public_ci_artifacts.py create `
            --input "environment-preflight.json=$rawPreflight" `
            --input "environment-preflight.log=$rawLog" `
            --output "environment-preflight.json=$safePreflight" `
            --output "environment-preflight.log=$safeLog" `
            --kind "environment-preflight.json=STRICT_JSON" `
            --kind "environment-preflight.log=STRICT_JSON" `
            --receipt $receipt `
            --repository-root $env:GITHUB_WORKSPACE `
            --temp-root $env:RUNNER_TEMP `
            --user-home $env:USERPROFILE `
            --environment-prefix $pythonPrefix `
            --host-name $env:COMPUTERNAME `
            --reference-commit $referenceCommit `
            --reference-tree $referenceTree
          if ($LASTEXITCODE -ne 0) { throw 'live environment preflight sanitization failed' }
          python scripts/sanitize_public_ci_artifacts.py verify `
            --output "environment-preflight.json=$safePreflight" `
            --output "environment-preflight.log=$safeLog" `
            --kind "environment-preflight.json=STRICT_JSON" `
            --kind "environment-preflight.log=STRICT_JSON" `
            --receipt $receipt `
            --repository-root $env:GITHUB_WORKSPACE `
            --user-home $env:USERPROFILE `
            --host-name $env:COMPUTERNAME
          if ($LASTEXITCODE -ne 0) { throw 'live sanitized environment preflight verification failed' }

      - name: Run and verify exact public-checkout failure contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $baseTemp = Join-Path $env:RUNNER_TEMP 'pytest-basetemp'
          if (Test-Path -LiteralPath $baseTemp) { throw 'pytest base temp unexpectedly pre-exists' }
          $junit = Join-Path $env:RUNNER_TEMP 'public-checkout-live.junit.xml'
          $log = Join-Path $env:RUNNER_TEMP 'public-checkout-live.log'
          $receipt = Join-Path $env:RUNNER_TEMP 'public-checkout-live-contract.raw-local-only.json'
          python -m pytest -q -p no:cacheprovider --tb=short --color=no --basetemp=$baseTemp --junitxml=$junit *> $log
          $pytestExit = $LASTEXITCODE
          if ($pytestExit -ne 1) { throw "expected pytest exit 1 before contract verification, got $pytestExit" }
          python scripts/verify_expected_public_checkout_failure_set.py `
            --registry provenance/V9R2R1_EXPECTED_PUBLIC_CHECKOUT_FAILURE_SET.json `
            --junit $junit `
            --log $log `
            --output $receipt
          if ($LASTEXITCODE -ne 0) { throw 'public-checkout exact failure contract drifted' }
          Write-Host 'PASS_EXPECTED_PUBLIC_CHECKOUT_FAILURE_SET: 78 expected failed outcomes, 0 unexpected failures.'
          Write-Warning 'Repository-wide green remains FALSE; expected failures were executed and were not xfailed, skipped, or converted to success.'

      - name: Sanitize and reverify live public-checkout evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rawJunit = Join-Path $env:RUNNER_TEMP 'public-checkout-live.junit.xml'
          $rawLog = Join-Path $env:RUNNER_TEMP 'public-checkout-live.log'
          $safeJunit = Join-Path $env:RUNNER_TEMP 'full_repository.sanitized.junit.xml'
          $safeLog = Join-Path $env:RUNNER_TEMP 'full_repository.sanitized.log'
          $sanitizationReceipt = Join-Path $env:RUNNER_TEMP 'V9R2R1_RAW_OUTPUT_SANITIZATION_RECEIPT.json'
          $contractReceipt = Join-Path $env:RUNNER_TEMP 'public-checkout-live-contract.sanitized.json'
          $referenceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve live checkout commit' }
          $referenceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve live checkout tree' }
          $pythonPrefix = (python -c "import sys; print(sys.prefix)").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve live Python prefix' }
          python scripts/sanitize_public_ci_artifacts.py create `
            --input "full_repository.junit.xml=$rawJunit" `
            --input "full_repository.log=$rawLog" `
            --output "full_repository.junit.xml=$safeJunit" `
            --output "full_repository.log=$safeLog" `
            --kind "full_repository.junit.xml=PYTEST_JUNIT_XML" `
            --kind "full_repository.log=PYTEST_LOG" `
            --receipt $sanitizationReceipt `
            --repository-root $env:GITHUB_WORKSPACE `
            --user-home $env:USERPROFILE `
            --environment-prefix $pythonPrefix `
            --temp-root $env:RUNNER_TEMP `
            --host-name $env:COMPUTERNAME `
            --reference-commit $referenceCommit `
            --reference-tree $referenceTree
          if ($LASTEXITCODE -ne 0) { throw 'live public-checkout evidence sanitization failed' }
          python scripts/sanitize_public_ci_artifacts.py verify `
            --output "full_repository.junit.xml=$safeJunit" `
            --output "full_repository.log=$safeLog" `
            --kind "full_repository.junit.xml=PYTEST_JUNIT_XML" `
            --kind "full_repository.log=PYTEST_LOG" `
            --receipt $sanitizationReceipt `
            --repository-root $env:GITHUB_WORKSPACE `
            --user-home $env:USERPROFILE `
            --host-name $env:COMPUTERNAME
          if ($LASTEXITCODE -ne 0) { throw 'sanitized live evidence verification failed' }
          python scripts/verify_expected_public_checkout_failure_set.py `
            --registry provenance/V9R2R1_EXPECTED_PUBLIC_CHECKOUT_FAILURE_SET.json `
            --junit $safeJunit `
            --log $safeLog `
            --output $contractReceipt
          if ($LASTEXITCODE -ne 0) { throw 'sanitized live failure contract drifted' }
          Write-Host 'PASS sanitized live evidence preserves the exact public-checkout failure contract.'

      - name: Upload live public-checkout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9r2r1-public-checkout-live-contract
          path: |
            ${{ runner.temp }}/public_checkout_live_environment_preflight.sanitized.json
            ${{ runner.temp }}/public_checkout_live_environment_preflight.sanitized.log
            ${{ runner.temp }}/public_checkout_live_environment_preflight.sanitization.json
            ${{ runner.temp }}/full_repository.sanitized.junit.xml
            ${{ runner.temp }}/full_repository.sanitized.log
            ${{ runner.temp }}/V9R2R1_RAW_OUTPUT_SANITIZATION_RECEIPT.json
            ${{ runner.temp }}/public-checkout-live-contract.sanitized.json
          if-no-files-found: warn
